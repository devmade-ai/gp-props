<!-- Google Analytics 4 (gtag.js)
     Requirement: Aggregate visitor metrics for the portfolio.
     Approach: Standard GA4 loader. Async, so it doesn't block flash-prevention
       (which is the synchronous script below this block) or first paint.
     CSP: hosts allowlisted in index.html / project.html / pattern.html
       (script-src + connect-src). Updating CSP without updating the snippet
       (or vice versa) silently breaks tracking — keep the two in sync. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MJWQS453DP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-MJWQS453DP');
</script>

<!-- Requirement: Prevent dark mode flash on page load
     Approach: Inline classic script reads localStorage and sets both .dark class
       (for Tailwind dark: variant) and data-theme (for DaisyUI component colors)
       before first paint. Must be classic script (not type="module") to execute
       synchronously during HTML parse.
     Alternative: Let DaisyUI auto-detect via prefers-color-scheme only — rejected,
       no manual toggle persistence
     Alternative: External script partial — rejected, must remain inline for
       synchronous execution before first paint -->
<script>
  (function() {
    try {
      // Requirement: Prevent flash using stored per-mode theme + dark/light preference
      // Reads lightTheme/darkTheme directly — no combo map needed.
      // Defaults must stay in sync with src/lib/themeCatalog.js
      // (DEFAULT_LIGHT_THEME / DEFAULT_DARK_THEME — generator-owned).
      var stored = localStorage.getItem('darkMode');
      var isDark = stored !== null
        ? stored === 'true'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = isDark
        ? (localStorage.getItem('darkTheme') || 'coffee')
        : (localStorage.getItem('lightTheme') || 'caramellatte');

      // Requirement: Theme lists for random picker AND validation
      // Auto-generated by scripts/generate-meta-colors.mjs — do not edit manually.
      var lt = [
        'retro', 'bumblebee', 'fantasy', 'lofi', 'garden', 'pastel', 'cupcake', 
        'emerald', 'light', 'silk', 'nord', 'cyberpunk', 'acid', 'caramellatte', 
        'corporate', 'autumn', 'wireframe', 'valentine', 'cmyk', 'winter', 'lemonade'
      ];
      var dt = [
        'aqua', 'coffee', 'halloween', 'night', 'dark', 'synthwave', 'dim', 'business', 
        'sunset', 'forest', 'dracula', 'abyss', 'luxury', 'black'
      ];

      // Requirement: Random theme on load when enabled
      // Approach: Pick a random theme from the current mode's list before first paint.
      //   Persists the chosen theme so the picker indicator matches.
      if (localStorage.getItem('randomThemeOnLoad') === 'true') {
        var list = isDark ? dt : lt;
        theme = list[Math.floor(Math.random() * list.length)];
        localStorage.setItem(isDark ? 'darkTheme' : 'lightTheme', theme);
      }

      // Requirement: Validate stored theme against known lists to prevent unstyled content
      // Approach: Reuse lt/dt arrays. Fall back to default if corrupted.
      if ((isDark ? dt : lt).indexOf(theme) === -1) {
        theme = isDark ? 'coffee' : 'caramellatte';
      }

      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      document.documentElement.setAttribute('data-theme', theme);

      // Light → primary hex, dark → base-100 hex.
      // Auto-generated by scripts/generate-meta-colors.mjs — do not edit manually.
      var mc = {
        retro:'#ff9fa0',bumblebee:'#fdc700',fantasy:'#6d0076',lofi:'#0d0d0d',garden:'#fe0075',
        pastel:'#e9d4ff',cupcake:'#44ebd3',emerald:'#66cc8a',light:'#422ad5',silk:'#1c1c29',
        nord:'#5e81ac',cyberpunk:'#ff6596',acid:'#ff00ff',caramellatte:'#000000',
        corporate:'#0082ce',autumn:'#8c0327',wireframe:'#d4d4d4',valentine:'#f43098',
        cmyk:'#45aeee',winter:'#0069ff',lemonade:'#419400',aqua:'#1a368b',coffee:'#261b25',
        halloween:'#1b1816',night:'#0f172a',dark:'#1d232a',synthwave:'#09002f',dim:'#2a303c',
        business:'#202020',sunset:'#121c22',forest:'#1b1717',dracula:'#282a36',abyss:'#001e29',
        luxury:'#09090b',black:'#000000'
      };
      var color = mc[theme] || '#808080';
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
    } catch(e) {
      // Requirement: Never break page render if localStorage is unavailable (sandboxed iframe, private browsing)
      // Approach: Catch all errors and fall back to default theme — better a flash than a broken page.
      // This intentionally does not log (console may not be available in all environments).
    }
  })();
</script>

<!-- Requirement: capture errors that happen before any module loads — the one
     failure mode the DEV-gated React debug pill cannot see is the bundle
     itself failing (DEBUG_SYSTEM.md "Pre-React inline pill", adapted: buffer +
     watchdog only; the pill UI is React and DEV-only in this repo).
     The 20s watchdog turns a silent blank page into a plain-language message:
     with render-then-replace, a failed module leaves whatever markup was
     prerendered but nothing interactive.
     Hand-off (DEBUG_SYSTEM.md, Pre-React Inline Pill): src/lib/debugLog.js
     drains __debugErrors, re-points __debugPushError at its store and calls
     __debugCaptureHandOff(), which detaches these listeners. They used to
     forward through the re-pointed global, so in dev every error landed in
     the store twice (measured: one throw, two entries). The listeners push
     to the LOCAL bufferPush for the same reason. The error listener is on
     the capture phase because a <script> that fails to load fires on the
     element and never reaches a bubbling window listener — the exact
     failure this block exists for.
     Cleanup contract: attach guard + the paired clearTimeout lives in
     __debugClearLoadTimer, called by every page entry after mount; the
     listeners are removed by __debugCaptureHandOff (dev; production has no
     store to hand off to, so they keep buffering, capped at 200). -->
<script>
  if (!window.__debugCaptureAttached) {
    window.__debugCaptureAttached = true;
    window.__debugErrors = [];
    (function () {
      function bufferPush(msg, stack) {
        window.__debugErrors.push({ msg: msg, stack: stack, time: Date.now() });
        if (window.__debugErrors.length > 200) window.__debugErrors.shift();
      }
      window.__debugPushError = bufferPush;
      function onError(e) {
        var t = e.target;
        if (t && t !== window && t.nodeType === 1) {
          if (t.tagName === 'SCRIPT') bufferPush('Could not load ' + (t.src || 'a script'));
          return;
        }
        bufferPush(e.message || 'Unknown error', e.filename + ':' + e.lineno);
      }
      function onRejection(e) {
        bufferPush('Unhandled rejection: ' + e.reason);
      }
      window.addEventListener('error', onError, true);
      window.addEventListener('unhandledrejection', onRejection);
      window.__debugCaptureHandOff = function () {
        window.removeEventListener('error', onError, true);
        window.removeEventListener('unhandledrejection', onRejection);
      };
    })();

    window.__debugReactMounted = false;
    window.__debugClearLoadTimer = function () {
      window.__debugReactMounted = true;
      clearTimeout(window.__debugLoadTimer);
    };
    window.__debugLoadTimer = setTimeout(function () {
      if (!window.__debugReactMounted) {
        var root = document.getElementById('root');
        // Prerendered pages already show real content when the bundle dies —
        // "taking longer to load" would be untrue there. Say what actually
        // failed in each case, in plain language.
        var hasContent = !!(root && root.children.length > 0);
        var warning = document.createElement('p');
        warning.style.cssText = 'color:#b45309;font-size:14px;margin:12px auto;max-width:32rem;text-align:center;font-family:system-ui,sans-serif';
        warning.textContent = hasContent
          ? 'Some parts of this page didn’t finish loading, so menus and buttons may not respond. Check your connection and reload the page.'
          : 'This page is taking longer than usual to load. Check your connection and reload the page.';
        if (root) root.appendChild(warning);
      }
    }, 20000);
  }
</script>

<!-- Requirement: Capture beforeinstallprompt before framework mounts
     Approach: Stash the event on window for pwa.js to consume later.
       On repeat visits with a cached SW, the event fires before any module
       scripts run — if nothing catches it, the install prompt is permanently lost.
       Named handler + attach guard (TIMER_LEAKS.md variant 5): the handler lives
       on window so pwa.js's dispose block can remove it, and the guard keeps a
       re-evaluated partial from double-subscribing.
     Alternative: Listen in pwa.js only — rejected, misses the early-fire case -->
<script>
  if (!window.__pwaInstallCaptureAttached) {
    window.__pwaInstallCaptureAttached = true;
    window.__pwaInstallCapture = function (e) {
      e.preventDefault();
      window.__pwaInstallPromptEvent = e;
      // Durable flag for the debug diagnostics probe — pwa.js deletes the
      // event object when it consumes it, so the probe checks this instead.
      window.__pwaPromptCaptured = true;
    };
    window.addEventListener('beforeinstallprompt', window.__pwaInstallCapture);
  }
</script>
