  <!-- Requirement: structured data (DISCOVERABILITY.md Step 5) on a page whose
       content is chosen by ?name=, so the item node cannot be static here.
       Approach: the two site-wide nodes are static and honest for every entry
         point; prerenderPages() replaces this JSON with the same graph plus the
         pattern's own TechArticle node for /patterns/<slug>/, and seoMeta.js
         writes the item node at runtime for the legacy ?name= form — the same
         channel that already sets the title and canonical there.
       Alternative: a static generic item node — rejected, it would assert that
         every pattern URL is the same article, which is the structured-data
         version of the static-canonical mistake this page avoids. -->
  <script type="application/ld+json" id="page-jsonld">
  {"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://gp-props.vercel.app/#org","name":"devmade-ai","url":"https://gp-props.vercel.app/","logo":"https://gp-props.vercel.app/assets/images/icon-512.png"},{"@type":"WebSite","@id":"https://gp-props.vercel.app/#website","url":"https://gp-props.vercel.app/","name":"devmade-ai","description":"Software projects, internal tools, and reusable engineering patterns by devmade-ai.","publisher":{"@id":"https://gp-props.vercel.app/#org"}}]}
  </script>

       rewrites root-relative URLs, so absolute forms break dev). The ?v=
       cache-bust query is appended at build by iconCacheBustHtml(), and
       prerenderPages() absolutizes these two for the nested item pages. -->
