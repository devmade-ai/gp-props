<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- Requirement: PWA status bar color that matches the active DaisyUI theme
       Approach: ONE unqualified meta, owned by JS — the pre-paint bootstrap
         (head-common.html) sets it to the active theme's color synchronously
         during head parse, and the theme module re-sets it on every change.
         The static value is the default light theme's color: dark is only
         ever applied by JS, so a no-JS page is always light. Light themes
         use primary hex, dark themes use base-100 hex — white status bar
         text must always be legible (see docs/AI_MISTAKES.md).
       Alternative: a media-qualified pair (one per prefers-color-scheme) —
         rejected 2026-08-28: Chromium re-evaluates media-qualified
         theme-color metas unreliably after a JS content update in
         standalone/WebAPK, sticking the Android status bar on the load-time
         color when the in-app theme disagrees with the OS scheme (observed
         on device in fc-fanfare-chess; the fix originated there and was
         upstreamed). The pair was also wrong for no-JS pages, which are
         always light. The feared iOS parse-gap flash of the single meta is
         sub-frame (the bootstrap is the adjacent head node) and was never
         observed. -->
  <meta name="theme-color" content="#000000">
  <!-- Requirement: Defense-in-depth against XSS — restrict script/style sources
       Approach: CSP meta tag allowing self, inline scripts (required for flash prevention),
         Google Fonts, and Google Analytics (gtag.js + GA4 beacons).
         GA hosts must be kept in sync with the snippet in partials/head-common.html.
         connect-src includes www.google.com because gtag.js retries a hit
         that google-analytics.com failed there; without it every failed hit
         logs a CSP refusal (seen in headless Chromium in px-pixelart,
         2026-09-27, and fixed there first).
       Alternative: HTTP header via vercel.json `headers` — possible since the move
         off GitHub Pages, but rejected: the policy would then only exist on Vercel,
         so `vite preview` and any local serve of dist/ would run unprotected and a
         CSP break would surface for the first time in production. Kept in the
         document so it ships with the page it protects. Cost: a meta-tag CSP
         cannot express `frame-ancestors` or `report-uri` — add a header if either
         is ever needed, and keep both in sync. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.google.com;">
  <link rel="canonical" href="https://gp-props.vercel.app/">
  <!-- Must match og:title / twitter:title. A bare brand token ("devmade-ai")
       says nothing in a search result, and disagreeing with the OG title makes
       a shared card and a search listing describe the same page differently.
       verify:seo enforces both properties. -->
  <title>devmade-ai — Project Portfolio</title>
  <meta name="description" content="Software projects, internal tools, and reusable engineering patterns by devmade-ai.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="devmade-ai">
  <meta property="og:title" content="devmade-ai — Project Portfolio">
  <meta property="og:description" content="Software projects, internal tools, and reusable engineering patterns by devmade-ai.">
  <meta property="og:url" content="https://gp-props.vercel.app/">
  <meta property="og:image" content="https://gp-props.vercel.app/assets/images/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The devmade-ai mark: four rounded squares in blue, emerald, amber and violet.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="devmade-ai — Project Portfolio">
  <meta name="twitter:description" content="Software projects, internal tools, and reusable engineering patterns by devmade-ai.">
  <meta name="twitter:image" content="https://gp-props.vercel.app/assets/images/og-image.png">
  <!-- Requirement: let a search engine resolve who publishes this site instead
       of inferring it from copy (DISCOVERABILITY.md Step 5).
       Approach: ONE @graph with @id-joined nodes. Organization and WebSite are
         true on every page of the site, so they are static here; the item pages
         carry the same two nodes plus their own, joined by @id rather than
         repeating the publisher inline.
       Alternatives:
         - A <script> per node: rejected — @id joins across separate blocks are
           legal but drift apart, and two blocks invite a duplicate node.
         - Marking up anything not rendered on the page: rejected — structured
           data that describes invisible content is a manual-action risk. -->
  <script type="application/ld+json" id="page-jsonld">
  {"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://gp-props.vercel.app/#org","name":"devmade-ai","url":"https://gp-props.vercel.app/","logo":"https://gp-props.vercel.app/assets/images/icon-512.png"},{"@type":"WebSite","@id":"https://gp-props.vercel.app/#website","url":"https://gp-props.vercel.app/","name":"devmade-ai","description":"Software projects, internal tools, and reusable engineering patterns by devmade-ai.","publisher":{"@id":"https://gp-props.vercel.app/#org"}}]}
  </script>
  <!-- Relative (correct from the root-level entries; Vite's dev server
       rewrites root-relative URLs, so absolute forms break dev). The ?v=
       cache-bust query is appended at build by iconCacheBustHtml(), and
       prerenderPages() absolutizes these two for the nested item pages. -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

  <!-- Shared <head> content injected from partials/head-common.html by htmlPartials Vite plugin.
       Includes: GA, dark mode bootstrap, beforeinstallprompt capture, fonts, main.css -->
  <!-- HEAD_COMMON -->
</head>
<body class="bg-base-100 text-base-content min-h-screen">

  <!-- React root. The build injects the SSG'd page markup here (crawlers and
       unfurlers read it); createRoot().render() replaces it on mount. -->
  <div id="root"></div>

  <script type="module" src="src/main-home.jsx"></script>
</body>
</html>
